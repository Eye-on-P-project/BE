name: BE CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: be-prod-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: eye_on
      MYSQL_USER: eyeon
      MYSQL_PASSWORD: eyeon_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      JWT_SECRET: test-secret-key-test-secret-key-test-secret-key
      COOKIE_SECURE: false
      COOKIE_SAMESITE: Lax
      EXPOSE_SWAGGER: false
      EXPOSE_DEV_API: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: eye_on
          MYSQL_USER: eyeon
          MYSQL_PASSWORD: eyeon_password
          MYSQL_ROOT_PASSWORD: root_password
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        command: redis-server --appendonly yes --requirepass redis_password
        options: >-
          --health-cmd="redis-cli -a redis_password ping | grep PONG"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  deploy:
    name: Deploy to GCP VM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy over IAP tunnel
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_USER: ${{ secrets.GCP_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SYSTEMD_SERVICE_NAME: ${{ secrets.SYSTEMD_SERVICE_NAME }}
        run: |
          set -euo pipefail

          KEY_FILE="${RUNNER_TEMP}/github_action_to_vm"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          gcloud compute start-iap-tunnel "${GCP_INSTANCE}" 22 \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --local-host-port=localhost:2222 \
            --verbosity=warning &
          TUNNEL_PID=$!
          trap 'kill "${TUNNEL_PID}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if nc -z 127.0.0.1 2222; then
              TUNNEL_READY=true
              break
            fi
            sleep 1
          done
          if [ "${TUNNEL_READY:-false}" != "true" ]; then
            echo "IAP tunnel did not become ready in time"
            exit 1
          fi

          APP_DIR="${DEPLOY_APP_DIR:-/opt/eyeon-be}"
          SERVICE_NAME="${SYSTEMD_SERVICE_NAME:-eyeon-be.service}"
          REMOTE_SCRIPT="$(mktemp)"
          cat > "${REMOTE_SCRIPT}" <<'REMOTE_EOF'
          set -euo pipefail

          echo "[deploy-bootstrap] app_dir=${APP_DIR}, branch=${BRANCH}, service=${SERVICE_NAME}"

          if [ ! -d "${APP_DIR}" ]; then
            echo "[deploy-bootstrap] ERROR: APP_DIR does not exist: ${APP_DIR}"
            exit 1
          fi

          cd "${APP_DIR}"

          if [ ! -d ".git" ]; then
            echo "[deploy-bootstrap] ERROR: APP_DIR is not a git repository: ${APP_DIR}"
            echo "[deploy-bootstrap] Current files:"
            ls -la
            exit 1
          fi

          echo "[deploy-bootstrap] Sync latest deploy script"
          git fetch origin "${BRANCH}"
          git checkout "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

          if [ ! -f "deploy/deploy.sh" ]; then
            echo "[deploy-bootstrap] ERROR: deploy/deploy.sh is still missing after git sync"
            echo "[deploy-bootstrap] Current files:"
            ls -la
            exit 1
          fi

          chmod +x deploy/deploy.sh
          bash deploy/deploy.sh
          REMOTE_EOF

          ssh -i "${KEY_FILE}" \
            -p 2222 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "${GCP_USER}@127.0.0.1" \
            "APP_DIR='${APP_DIR}' BRANCH='main' SERVICE_NAME='${SERVICE_NAME}' bash -s" < "${REMOTE_SCRIPT}"
