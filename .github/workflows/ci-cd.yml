name: BE CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: be-prod-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: eye_on
      MYSQL_USER: eyeon
      MYSQL_PASSWORD: eyeon_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      JWT_SECRET: test-secret-key-test-secret-key-test-secret-key
      COOKIE_SECURE: false
      COOKIE_SAMESITE: Lax
      EXPOSE_SWAGGER: false
      EXPOSE_DEV_API: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: eye_on
          MYSQL_USER: eyeon
          MYSQL_PASSWORD: eyeon_password
          MYSQL_ROOT_PASSWORD: root_password
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        command: redis-server --appendonly yes --requirepass redis_password
        options: >-
          --health-cmd="redis-cli -a redis_password ping | grep PONG"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  deploy:
    name: Deploy to GCP VM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy over IAP SSH
        uses: google-github-actions/ssh-compute@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          instance_name: ${{ secrets.GCP_INSTANCE }}
          zone: ${{ secrets.GCP_ZONE }}
          user: ${{ secrets.GCP_USER }}
          ssh_private_key: ${{ secrets.GCP_SSH_KEY }}
          flags: --tunnel-through-iap
          command: |
            set -e
            export APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then APP_DIR="/opt/eyeon-be"; fi
            export BRANCH="main"
            export SERVICE_NAME="${{ secrets.SYSTEMD_SERVICE_NAME }}"
            if [ -z "${SERVICE_NAME}" ]; then SERVICE_NAME="eyeon-be.service"; fi
            bash "${APP_DIR}/deploy/deploy.sh"
