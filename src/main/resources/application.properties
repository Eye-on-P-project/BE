spring.application.name=eye-on
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:eye_on}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXP:900}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXP:1209600}

# Security / Cookie
app.security.refresh-cookie-name=refreshToken
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-same-site=${COOKIE_SAMESITE:Lax}
app.security.cookie-path=/
app.security.cookie-domain=${COOKIE_DOMAIN:}
app.security.expose-swagger=${EXPOSE_SWAGGER:false}
spring.security.user.name=disabled
spring.security.user.password=disabled

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:8}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:80}
